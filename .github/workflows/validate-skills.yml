name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository structure and frontmatter
        run: python3 tools/validate_skills.py

      - name: Validate skills.json is valid JSON
        run: python3 -c "import json;d=json.load(open('skills.json'));print(len(d['skills']),'skills registered')"

      - name: Byte-compile all scripts
        run: python3 -m compileall -q .
